<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512">
  <!-- Source of custom_components/helios/brand/icon.png and icon@2x.png -->

  <!-- Night blue squircle background -->
  <rect width="512" height="512" rx="96" ry="96" fill="#0D2847"/>

  <!-- Main sighting axes -->
  <g stroke="#90CAF9" stroke-width="5" stroke-linecap="round">
    <line x1="256" y1="28" x2="256" y2="118"/>
    <line x1="256" y1="394" x2="256" y2="484"/>
    <line x1="28" y1="256" x2="118" y2="256"/>
    <line x1="394" y1="256" x2="484" y2="256"/>
  </g>

  <!-- Astronomical diagonals -->
  <g stroke="#90CAF9" stroke-width="4" stroke-linecap="round">
    <line x1="325" y1="187" x2="430" y2="82" stroke-dasharray="6,8"/>
    <line x1="82" y1="430" x2="187" y2="325" stroke-dasharray="6,8"/>
    <line x1="325" y1="325" x2="424" y2="424"/>
  </g>

  <!-- Orbital circles -->
  <g fill="none">
    <circle cx="256" cy="256" r="204" stroke="#FFFFFF" stroke-width="5"/>
    <circle cx="256" cy="256" r="176" stroke="#90CAF9" stroke-width="5"/>
    <circle cx="256" cy="256" r="158" stroke="#90CAF9" stroke-width="3.5" stroke-dasharray="6,8"/>
  </g>

  <g transform="translate(256,256)">
    <!-- 12 two-tone sun rays, 30° apart -->
    <defs>
      <g id="ray">
        <polygon points="0,-148 -22,-92 0,-92" fill="#FFA000"/>
        <polygon points="0,-148 22,-92 0,-92" fill="#F57C00"/>
      </g>
    </defs>
    <use xlink:href="#ray"/>
    <use xlink:href="#ray" transform="rotate(30)"/>
    <use xlink:href="#ray" transform="rotate(60)"/>
    <use xlink:href="#ray" transform="rotate(90)"/>
    <use xlink:href="#ray" transform="rotate(120)"/>
    <use xlink:href="#ray" transform="rotate(150)"/>
    <use xlink:href="#ray" transform="rotate(180)"/>
    <use xlink:href="#ray" transform="rotate(210)"/>
    <use xlink:href="#ray" transform="rotate(240)"/>
    <use xlink:href="#ray" transform="rotate(270)"/>
    <use xlink:href="#ray" transform="rotate(300)"/>
    <use xlink:href="#ray" transform="rotate(330)"/>

    <!-- Night blue separation ring -->
    <circle r="88" fill="#0D2847"/>
    <!-- Two-tone solar disc: yellow left, orange right -->
    <path d="M 0,-76 A 76,76 0 0,0 0,76 Z" fill="#FFD524"/>
    <path d="M 0,-76 A 76,76 0 0,1 0,76 Z" fill="#F57C00"/>
  </g>
</svg>
